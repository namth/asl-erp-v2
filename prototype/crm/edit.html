<!DOCTYPE html>
<html lang="vi">
<head>
  <script>(function(){if(localStorage.getItem('asl_theme')==='dark'){document.documentElement.classList.add('dark');}else{document.documentElement.classList.remove('dark');}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL LAW - Chỉnh Sửa Thông Tin Khách Hàng (Edit Client)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/layout.css?v=3.3">
  <script src="../assets/layout.js?v=3.3" defer></script>
</head>
<body class="min-h-screen bg-[#F4F8FA] text-slate-800 flex">  <!-- Modular Shared Sidebar (Auto-mounted by layout.js) -->
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-white/95 backdrop-blur-xl z-40 transition-all duration-300 ease-in-out flex flex-col justify-between shadow-xl shadow-slate-900/5"></aside>

  <!-- Main Container -->
  <div id="main-container" class="flex-1 md:ml-72 flex flex-col min-h-screen transition-all duration-300 ease-in-out">

    <!-- Top Bar with Rich Brand Gradient -->
    <header class="header-gradient text-white h-20 px-6 flex items-center justify-between sticky top-0 z-30 shadow-md">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <div class="text-xs text-cyan-200/90 font-medium flex items-center gap-1.5">
            <a href="detail.html?role=admin" class="hover:underline">Công ty CP Sao Nam</a>
            <span>/</span>
            <span class="text-white font-semibold">Cập Nhật Thông Tin</span>
          </div>
          <h1 class="text-lg font-bold text-white tracking-tight">Chỉnh Sửa Hồ Sơ Thân Chủ Doanh Nghiệp</h1>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="detail.html?role=admin" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold text-xs transition-colors">
          &larr; Về Hồ Sơ Khách Hàng
        </a>
      </div>
    </header>

    <!-- Main Content Form -->
    <main class="flex-1 p-6 md:p-8 max-w-none mx-auto w-full space-y-8">

      <form onsubmit="event.preventDefault(); alert('Cập nhật hồ sơ khách hàng thành công!'); window.location.href=withRole('detail.html');" class="space-y-8">

        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-6">
          <div class="border-b border-slate-100 pb-3">
            <h2 class="text-base font-bold text-[#002D54]">Thông Tin Pháp Nhân Doanh Nghiệp</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-xs">
            <div class="md:col-span-2">
              <label class="block font-bold text-slate-700 mb-1">Tên Doanh Nghiệp</label>
              <input type="text" value="Công ty Cổ phần Công nghệ Sao Nam" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 text-sm font-semibold focus:border-[#0082B4] focus:outline-none">
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">Mã Số Thuế (MST)</label>
              <input type="text" value="0108998822" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 font-mono font-bold focus:border-[#0082B4] focus:outline-none">
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">Phân Loại Thân Chủ</label>
              <select class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:border-[#0082B4] font-bold text-[#002D54]">
                <option selected>VIP / Thân Thiết (Retainer Client)</option>
                <option>Doanh Nghiệp Tiêu Chuẩn</option>
                <option>Doanh Nghiệp FDI Có Vốn Nước Ngoài</option>
                <option>Khách Hàng Cá Nhân</option>
              </select>
            </div>

            <div class="md:col-span-2">
              <label class="block font-bold text-slate-700 mb-1">Địa Chỉ Đăng Ký Kinh Doanh</label>
              <input type="text" value="Tầng 12, Tòa nhà Keangnam Landmark 72, Đường Mễ Trì, Q. Nam Từ Liêm, Hà Nội" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:border-[#0082B4] focus:outline-none">
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">Người Đại Diện Pháp Luật</label>
              <input type="text" value="Trần Văn Nam" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:border-[#0082B4] focus:outline-none">
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">Số Điện Thoại Hotline</label>
              <input type="tel" value="0912.888.xxx" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:border-[#0082B4] focus:outline-none">
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between pt-2">
          <a href="detail.html?role=admin" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-bold text-xs hover:bg-slate-100">
            Hủy Bỏ
          </a>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-[#002D54] hover:bg-[#0082B4] text-white font-bold text-xs shadow-md">
            Lưu Thông Tin Khách Hàng
          </button>
        </div>

      </form>

    </main>

  </div>

</body>
</html>
