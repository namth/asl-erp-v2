<!DOCTYPE html>
<html lang="vi">
<head>
  <script>(function(){if(localStorage.getItem('asl_theme')==='dark'){document.documentElement.classList.add('dark');}else{document.documentElement.classList.remove('dark');}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL LAW - Ghi Nhận Giờ Làm Việc (Timesheet Entry)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/layout.css?v=3.3">
  <script src="../assets/layout.js?v=3.3" defer></script>
</head>
<body class="min-h-screen bg-[#F4F8FA] text-slate-800 flex">  <!-- Modular Shared Sidebar (Auto-mounted by layout.js) -->
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-white/95 backdrop-blur-xl z-40 transition-all duration-300 ease-in-out flex flex-col justify-between shadow-xl shadow-slate-900/5"></aside>

  <!-- Main Content Layout -->
  <div id="main-content" class="ml-72 flex-1 flex flex-col min-h-screen transition-all duration-300 ease-in-out">
    
    <!-- Top Deep Brand Gradient Header -->
    <header class="header-gradient text-white sticky top-0 z-30 shadow-md">
      <div class="h-20 px-8 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="index.html?role=admin" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-colors" title="Quay lại chấm công">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          </a>
          <div>
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] bg-cyan-500/30 text-cyan-300 font-bold border border-cyan-400/40">MANUAL TIME ENTRY</span>
            </div>
            <h1 class="text-xl font-extrabold tracking-tight text-white">
              Ghi Nhận Giờ Làm Việc Thủ Công
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a href="index.html?role=admin" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold transition-all">
            Hủy Bỏ
          </a>
          <button type="submit" form="time-entry-form" class="px-5 py-2 rounded-xl bg-gradient-to-r from-[#FF7A00] to-[#E66E00] text-white text-xs font-bold shadow-md shadow-orange-900/30 hover:scale-105 transition-all">
            Lưu Nhật Ký Giờ Làm
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace Form -->
    <main class="p-8 max-w-none mx-auto w-full space-y-6">

      <form id="time-entry-form" action="index.html" method="get" class="glass-card rounded-2xl p-8 border border-slate-200/80 bg-white space-y-6 shadow-sm">
        
        <div class="border-b border-slate-100 pb-4">
          <h3 class="text-sm font-extrabold text-[#002D54] uppercase tracking-wider">Thông Tin Phiên Làm Việc</h3>
          <p class="text-xs text-slate-400">Ghi nhận chính xác chi tiết công việc để xuất phụ lục tính phí khách hàng</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Vụ việc tính phí (Case) <span class="text-red-500">*</span></label>
            <select required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]">
              <option selected>ASL-2026-FDI-048 - SmartLogistics Quốc Tế</option>
              <option>ASL-2026-MA-019 - Công ty CP Sao Nam</option>
              <option>ASL-2026-IP-033 - MedTech AI Global</option>
              <option value="none">[Nội bộ hãng luật - Không tính phí thân chủ]</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Mã hoạt động pháp lý (Activity Code)</label>
            <select class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]">
              <option selected>A102 - Soạn thảo hợp đồng / Thư tư vấn</option>
              <option>A101 - Nghiên cứu hồ sơ & Tiền lệ pháp lý</option>
              <option>A103 - Gặp mặt & Đàm phán cùng Thân chủ</option>
              <option>A104 - Làm việc với Cơ quan Nhà nước có thẩm quyền</option>
              <option>A105 - Tham gia phiên tòa / Trọng tài thương mại</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Ngày thực hiện</label>
            <input type="date" value="2026-10-27" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Thời lượng (Số giờ làm) <span class="text-red-500">*</span></label>
            <div class="relative">
              <input type="number" step="0.25" min="0.25" max="24" value="2.5" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]">
              <span class="absolute right-3 top-2 text-xs text-slate-400 font-bold">giờ (hours)</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Mô tả chi tiết công việc đã thực hiện <span class="text-red-500">*</span></label>
          <textarea rows="4" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]" placeholder="Ghi rõ nội dung nghiên cứu, điều khoản hợp đồng đã rà soát để xuất bảng kê thanh toán gửi khách hàng...">Soạn thảo và chỉnh sửa bản điều lệ công ty và hồ sơ giải trình phương án địa điểm kho bãi logistics tại KCN Cát Lái theo yêu cầu Sở KH&ĐT TP.HCM.</textarea>
        </div>

        <!-- Billable Checkbox -->
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-[#002D54]">Tính phí vào Hóa đơn Thân chủ (Billable Hour)</div>
            <div class="text-[11px] text-slate-400">Đơn giá giờ tiêu chuẩn của Luật sư: 3.000.000 VNĐ / giờ ($125/h)</div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" checked class="sr-only peer">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
          </label>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <a href="index.html?role=admin" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold transition-colors">
            Hủy Bỏ
          </a>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#002D54] to-[#0082B4] text-white text-xs font-bold shadow-md shadow-cyan-950/20 hover:scale-105 transition-all">
            Ghi Nhận Giờ & Quay Lại Bảng Chấm Công
          </button>
        </div>

      </form>

    </main>

  </div>

</body>
</html>
