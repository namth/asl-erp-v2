<!DOCTYPE html>
<html lang="vi">
<head>
  <script>(function(){if(localStorage.getItem('asl_theme')==='dark'){document.documentElement.classList.add('dark');}else{document.documentElement.classList.remove('dark');}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL LAW - Chỉnh Sửa Phân Quyền & Hồ Sơ Nhân Sự</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/layout.css?v=3.3">
  <script src="../assets/layout.js?v=3.3" defer></script>
</head>
<body class="min-h-screen bg-[#F4F8FA] text-slate-800 flex">  <!-- Modular Shared Sidebar (Auto-mounted by layout.js) -->
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-white/95 backdrop-blur-xl z-40 transition-all duration-300 ease-in-out flex flex-col justify-between shadow-xl shadow-slate-900/5"></aside>

  <!-- Main Content Layout -->
  <div id="main-content" class="ml-72 flex-1 flex flex-col min-h-screen transition-all duration-300 ease-in-out">
    
    <!-- Top Deep Brand Gradient Header -->
    <header class="header-gradient text-white sticky top-0 z-30 shadow-md">
      <div class="h-20 px-8 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="detail.html?role=admin" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-colors" title="Quay lại hồ sơ nhân sự">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          </a>
          <div>
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] bg-amber-500/30 text-amber-300 font-bold border border-amber-400/40">CHỈNH SỬA THÔNG TIN & RBAC</span>
              <span class="text-xs text-cyan-200/80 font-mono">STAFF ID: ASL-STAFF-008</span>
            </div>
            <h1 class="text-xl font-extrabold tracking-tight text-white">
              Cập Nhật Phân Quyền & Quyền Truy Cập: LS. Phạm Quốc Khánh
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a href="detail.html?role=admin" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold transition-all">
            Hủy Bỏ
          </a>
          <button type="submit" form="edit-user-form" class="px-5 py-2 rounded-xl bg-gradient-to-r from-[#FF7A00] to-[#E66E00] text-white text-xs font-bold shadow-md shadow-orange-900/30 hover:scale-105 transition-all">
            Lưu Thay Đổi
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace Form -->
    <main class="p-8 max-w-none mx-auto w-full space-y-6">

      <form id="edit-user-form" action="detail.html" method="get" class="space-y-6">

        <div class="glass-card rounded-2xl p-6 border border-slate-200/80 bg-white space-y-5">
          <h3 class="text-xs font-extrabold text-[#002D54] uppercase tracking-wider border-b border-slate-100 pb-3">
            Thông Tin Tài Khoản
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Họ và tên</label>
              <input type="text" value="LS. Phạm Quốc Khánh" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Email đăng nhập</label>
              <input type="email" value="khanh.pq@aslgate.com" readonly class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-400 bg-slate-50 cursor-not-allowed">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Vai trò hệ thống</label>
              <select class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]">
                <option selected>Case Manager (Quản lý Vụ việc)</option>
                <option>Senior Associate</option>
                <option>Managing Partner</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Trạng thái tài khoản</label>
              <select class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-[#0082B4]">
                <option selected>Đang hoạt động bình thường</option>
                <option>Tạm khóa (On Leave)</option>
                <option>Chấm dứt quyền truy cập</option>
              </select>
            </div>
          </div>
        </div>

        <div class="glass-card rounded-2xl p-6 border border-slate-200/80 bg-white space-y-5">
          <h3 class="text-xs font-extrabold text-[#002D54] uppercase tracking-wider border-b border-slate-100 pb-3">
            Quyền Hạn RBAC Chi Tiết
          </h3>

          <div class="space-y-3 text-xs">
            <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 hover:bg-slate-100/70 cursor-pointer transition-colors">
              <input type="checkbox" checked class="w-4 h-4 rounded text-[#0082B4] focus:ring-0">
              <div>
                <div class="font-bold text-slate-800">Quyền phê duyệt giai đoạn vụ việc (Gate Approval)</div>
                <div class="text-[11px] text-slate-400">Cho phép ký duyệt chuyển giai đoạn hồ sơ khi đủ điều kiện công việc</div>
              </div>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 hover:bg-slate-100/70 cursor-pointer transition-colors">
              <input type="checkbox" checked class="w-4 h-4 rounded text-[#0082B4] focus:ring-0">
              <div>
                <div class="font-bold text-slate-800">Quyền giao việc và chỉ định Luật sư thực thi (Assign Task & Subtasks)</div>
                <div class="text-[11px] text-slate-400">Phân công công việc cho thành viên trong Case Team</div>
              </div>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 hover:bg-slate-100/70 cursor-pointer transition-colors">
              <input type="checkbox" checked class="w-4 h-4 rounded text-[#0082B4] focus:ring-0">
              <div>
                <div class="font-bold text-slate-800">Truy cập Trợ lý AI và Hồ sơ Pháp lý Confidential</div>
                <div class="text-[11px] text-slate-400">Sử dụng prompt bảo mật cao và tra cứu tài liệu mật của khách hàng</div>
              </div>
            </label>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <a href="detail.html?role=admin" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold transition-colors">
            Hủy Bỏ
          </a>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#002D54] to-[#0082B4] text-white text-xs font-bold shadow-md shadow-cyan-950/20 hover:scale-105 transition-all">
            Cập Nhật Quyền Hạn
          </button>
        </div>

      </form>

    </main>

  </div>

</body>
</html>
