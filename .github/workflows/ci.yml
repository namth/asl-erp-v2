name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run test
        run: npm run test

      - name: Run build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asl_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci_neo4j_password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@localhost:5432/asl_erp_ci
      DATABASE_SYNC_URL: postgresql://postgres:ci_postgres_password@localhost:5432/asl_erp_ci
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci_neo4j_password
      NEO4J_DATABASE: neo4j
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-do-not-use-in-production-32bytes
      DATA_ENCRYPTION_MASTER_KEY: ci-only-encryption-master-key-32b
      ASL_OWNER_PASSWORD: ci_asl_owner_password
      ASL_APP_PASSWORD: ci_asl_app_password
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and ruff
        run: pip install -r backend/requirements.txt ruff

      - name: Lint with ruff
        run: ruff check backend

      - name: Run migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Seed database
        run: python -m backend.app.scripts.seed

      - name: Run backend tests
        run: pytest backend/tests -v
